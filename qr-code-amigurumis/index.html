<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CinCinSalabim - Amigurumis da Soninha QR Code</title>
    <script src="https://cdn.jsdelivr.net/npm/easyqrcodejs@4.6.1/dist/easy.qrcode.min.js"></script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f7f6f2;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .qr-card {
        padding: 24px;
        background-color: #fff6ff;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        text-align: center;
      }

      .caption {
        margin-top: 16px;
        font-size: 14px;
        color: #2b2b2b;
        line-height: 1.4;
      }

      .caption a {
        font-weight: 600;
        color: #7c424b;
        text-decoration: none;
      }

      .caption a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="qr-card">
      <div id="qrcode"></div>

      <div class="caption">
        <a
          href="https://www.instagram.com/amigurumisdasoninha"
          target="_blank"
          rel="noopener"
        >
          https://www.instagram.com/amigurumisdasoninha
        </a>
        <br />
        Para mais detalhes, escaneie e peça o seu.
      </div>
    </div>

    <script>
      new QRCode(document.getElementById("qrcode"), {
        text: "https://www.instagram.com/amigurumisdasoninha",
        width: 260,
        height: 260,
        colorDark: "#363636",
        colorLight: "#FFEFE6",

        correctLevel: QRCode.CorrectLevel.H,

        logo: "./assets/image-logo.png",
        logoWidth: 60,
        logoHeight: 60,
        logoBackgroundColor: "#",
        logoBackgroundTransparent: false,
      });
    </script>
  </body>
</html>
